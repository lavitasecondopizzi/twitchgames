<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tortello Games · Guest View</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #efeaff;
      font-family: "Press Start 2P", monospace;
      background:
              linear-gradient(180deg, rgba(255,255,255,0.04) 1px, transparent 1px) 0 0/100% 4px,
              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px) 0 0/4px 100%,
              linear-gradient(150deg, #171032, #332173 60%, #111025);
      image-rendering: pixelated;
    }

    .card {
      width: min(840px, 92vw);
      padding: 1.3rem;
      text-align: center;
      border: 4px solid #9f92ff;
      box-shadow: 0 0 0 4px #312769;
      background: rgba(11, 9, 30, 0.9);
      line-height: 1.9;
      font-size: clamp(0.56rem, 1.4vw, 0.72rem);
    }

    .small { color: #baafea; font-size: 0.58rem; }
    .game { color: #d3ffef; }
  </style>
</head>
<body>
<main class="card">
  <p>SEI NELLA PAGINA OSPITE</p>
  <p class="small">Attendi l'avvio della partita da parte dello streamer.</p>
  <p class="small">Gioco selezionato: <span class="game" id="gameName">In attesa</span></p>
  <p class="small" id="gameHint">Pagina statica: nessun link o codice sensibile mostrato.</p>
</main>

<script>
  const game = decodeURIComponent((location.hash || '').replace('#game=', '')).trim();
  const nameMap = {
    'impiccato': 'Impiccato',
    'indovina-chi': 'Indovina Chi',
    'paper-please': 'Paper Please',
    'dark-stories': 'Glu Glu Stories'
  };
  const hintMap = {
    'impiccato': 'Quando lo streamer avvia, preparati a giocare come ospite/chat.',
    'indovina-chi': 'Quando lo streamer avvia, ti verrà assegnato il ruolo B.',
    'paper-please': 'Quando lo streamer avvia, segui il round direttamente in live.',
    'dark-stories': 'Invia domande sì/no al Master e prova a risolvere il mistero.'
  };

  const gameName = nameMap[game] || 'In attesa';
  document.getElementById('gameName').textContent = gameName;
  document.getElementById('gameHint').textContent = hintMap[game] || 'Pagina statica: nessun link o codice sensibile mostrato.';
</script>
</body>
</html>
